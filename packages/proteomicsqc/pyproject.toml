[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proteomics_qc"
version = "0.1.0"
description = "Proteomics QC guardrails (proteins identified, missingness) for the transcriptomics-parallel proteomics pack."
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "pydantic",
    "numpy",
    "h5py",
    "methylutils",
    "omics_features",
]

[project.optional-dependencies]
dev = []

[project.scripts]
proteomics-qc = "proteomics_qc.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["proteomics_qc*"]
