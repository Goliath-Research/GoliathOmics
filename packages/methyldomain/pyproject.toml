[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "methyl_domain"
version = "0.1.0"
description = "Tagged domain types for MethylPipeline workflow scope variables."
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "pydantic>=2.6.0,<3.0.0",
    "methylutils",
    "cryptography>=42.0.0",
    "azure-identity>=1.15.0",
    "azure-keyvault-secrets>=4.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.scripts]
methyl-export-domain-schemas = "methyl_domain.schema_export:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["methyl_domain*"]
