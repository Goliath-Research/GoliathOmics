[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proteomics_features"
version = "0.1.0"
description = "Proteomics adapter over the shared omics_features seam: DIA-NN / panel ingest to the abundance contract, and differential-abundance selection."
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "pydantic",
    "numpy",
    "pandas",
    "h5py",
    "methylutils",
    "omics_features",
]

[project.optional-dependencies]
dev = []

[project.scripts]
methyl-protein-de-select = "proteomics_features.cli.de_select:main"
methyl-register-abundance = "proteomics_features.cli.register:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["proteomics_features*"]
