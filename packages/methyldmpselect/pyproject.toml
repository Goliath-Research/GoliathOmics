[tool.poetry]
name = "methyl-dmp-select"
version = "0.1.0"
description = "DMP panel selection (FeatureCuts / elbow) from MethylDetector discovery exports"
authors = ["MethylPipeline Team"]
readme = "README.md"
packages = [{include = "methyl_dmp_select"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
pydantic = ">=2.6.0,<3.0.0"
numpy = ">=2.0.0,<3.0.0"
pandas = ">=2.1.0,<3.0.0"
click = ">=8.1.0,<9.0.0"
methylutils = {path = "../methylutils", develop = true}
methyl-domain = {path = "../methyldomain", develop = true}
methyl-detector = {path = "../methyldetector", develop = true}

[tool.poetry.scripts]
methyl-dmp-select = "methyl_dmp_select.cli.main:main"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
