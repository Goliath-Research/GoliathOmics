[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rna_alignment_qc"
version = "0.1.0"
description = "RNA-Seq alignment/quantification QC guardrails (STAR rna_fq2bam and kallisto)."
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "pydantic",
    "methylutils",
]

[project.optional-dependencies]
dev = []

[project.scripts]
rna-alignment-qc = "rna_alignment_qc.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rna_alignment_qc*"]
