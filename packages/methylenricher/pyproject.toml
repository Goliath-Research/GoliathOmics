[tool.poetry]
name = "methyl_enricher"
version = "0.1.0"
description = "Gene enrichment analysis tool for methylation DMPs"
authors = ["MethylDetector Team"]
readme = "README.md"
packages = [{include = "methyl_enricher"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
gseapy = ">=1.1.0"
pandas = ">=2.1.0,<3.0.0"
numpy = ">=2.0.0,<3.0.0"
networkx = ">=3.0"
python-louvain = ">=0.16"
requests = ">=2.28"
pyfaidx = ">=0.7"
methylutils = {path = "../methylutils", develop = true}
methyl-domain = {path = "../methyldomain", develop = true}

[tool.poetry.scripts]
methyl-enricher = "methyl_enricher.cli:main"
methyl_enricher = "methyl_enricher.cli:main"
methyl-enricher-network-discovery = "methyl_enricher.network_discovery_cli:main"
methyl_enricher_network_discovery = "methyl_enricher.network_discovery_cli:main"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
pytest-cov = "^4.0.0"
black = "^23.0.0"
flake8 = "^6.0.0"
mypy = "^1.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

