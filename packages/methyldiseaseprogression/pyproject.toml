[tool.poetry]
name = "methyl-disease-progression"
version = "0.1.0"
description = "Cross-stage disease progression synthesis from MethylMapper and MethylEnricher outputs"
authors = ["MethylPipeline Development Team"]
readme = "README.md"
packages = [{include = "methyl_disease_progression"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
pandas = ">=2.1.0,<3.0.0"
pydantic = ">=2.6.0,<3.0.0"
methylutils = {path = "../methylutils", develop = true}

[tool.poetry.scripts]
methyl-disease-progression = "methyl_disease_progression.cli:main"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
black = "^23.0.0"
flake8 = "^6.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
