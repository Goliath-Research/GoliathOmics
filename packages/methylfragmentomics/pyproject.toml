[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "methyl_fragmentomics"
version = "0.1.0"
description = "cfDNA fragmentomics (WPS, end motifs) from aligned BAMs for MethylPipeline."
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "pydantic>=2.6.0,<3.0.0",
    "methylutils",
    "pysam>=0.22.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.scripts]
methyl-fragmentomics = "methyl_fragmentomics.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["methyl_fragmentomics*"]
