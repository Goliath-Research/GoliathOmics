[tool.poetry]
name = "methyl-detector"
version = "0.2.0"
description = "A genomics DMP detection tool using enhanced centroid-based comparison with FDR correction"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "methyl_detector"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
pydantic = ">=2.6.0,<3.0.0"
numpy = ">=2.0.0,<3.0.0"
pandas = ">=2.1.0,<3.0.0"
scikit-learn = ">=1.4.0,<2.0.0"
matplotlib = ">=3.8.0,<4.0.0"
plotly = ">=5.18.0,<7.0.0"
tqdm = ">=4.66.0,<5.0.0"
click = ">=8.1.0,<9.0.0,!=8.2.2"
# Note: methylutils is part of the MethylPipeline monorepo at packages/methylutils
methylutils = {path = "../methylutils", develop = true}
methyl-domain = {path = "../methyldomain", develop = true}

# RAPIDS dependencies for GPU acceleration (installed in base image)
# cudf = "^25.6.0"
# cuml = "^25.6.0"
# cupy-cuda13x = "^13.6.0"

# HDF5 support for genomics data
h5py = ">=3.10.0,<4.0.0"
seaborn = ">=0.13.0,<0.14.0"
hdf5plugin = ">=5.0.0,<7.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^4.1.0"
black = "^24.1.0"
isort = "^5.13.0"
flake8 = "^7.0.0"
mypy = "^1.8.0"

[tool.poetry.scripts]
methyl-detector = "methyl_detector.cli.main:main"
methyl-detector-explorer = "methyl_detector.cli.explorer_main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312', 'py313', 'py314']

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true 