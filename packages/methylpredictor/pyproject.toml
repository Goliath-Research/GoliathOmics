[tool.poetry]
name = "methyl-predictor"
version = "0.1.0"
description = "Run MethylClassifier on test sample sets and compute classification metrics (MethylPredictor)"
authors = ["MethylPipeline Development Team"]
readme = "README.md"
packages = [{include = "methyl_predictor"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
numpy = ">=2.0.0,<3.0.0"
pandas = ">=2.1.0,<3.0.0"
pydantic = ">=2.6.0,<3.0.0"
scikit-learn = ">=1.3.0,<2.0.0"
h5py = ">=3.10.0,<4.0.0"
hdf5plugin = ">=5.0.0,<7.0.0"
methylutils = {path = "../methylutils", develop = true}
methyl_classifier = {path = "../methylclassifier", develop = true}

[tool.poetry.scripts]
methyl-predictor = "methyl_predictor.cli:main"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
pytest-cov = "^4.0.0"
black = "^23.0.0"
flake8 = "^6.0.0"
mypy = "^1.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
