[tool.poetry]
name = "methyl_classifier"
version = "0.1.0"
description = "Command Line Tool for Methylation-Based Sample Classification"
authors = ["MethylClassifier Development Team"]
readme = "README.md"
packages = [{include = "methyl_classifier"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
numpy = ">=2.0.0,<3.0.0"
scipy = ">=1.11.0,<2.0.0"
pandas = ">=2.1.0,<3.0.0"
h5py = ">=3.10.0,<4.0.0"
matplotlib = ">=3.8.0,<4.0.0"
seaborn = ">=0.13.0,<0.14.0"
methylutils = {path = "../methylutils", develop = true}
methyl-detector = {path = "../methyldetector", develop = true}
scikit-learn = ">=1.3.0,<2.0.0"
tqdm = ">=4.66.0"

[tool.poetry.scripts]
methyl-classifier = "methyl_classifier.cli:main"
methyl-classifier-train = "methyl_classifier.cli.train_main:main"
methyl_classifier = "methyl_classifier.cli:main"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
pytest-cov = "^4.0.0"
black = "^23.0.0"
flake8 = "^6.0.0"
mypy = "^1.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

