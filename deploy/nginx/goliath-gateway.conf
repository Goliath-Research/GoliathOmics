# Goliath gateway reverse proxy.
# TLS certificates are site-specific; the 443 server is a template.
# Health check: https://<fqdn>/v1/health

upstream goliath_gateway {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    location /v1/health {
        proxy_pass http://goliath_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}

