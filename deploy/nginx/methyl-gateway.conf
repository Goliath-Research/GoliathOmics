# TLS reverse proxy for methyl-gateway (uvicorn on 127.0.0.1:8080).
# Install: scripts/setup_gateway_nginx.sh
#
# Replace GATEWAY_HOSTNAME and certificate paths before enabling.
#
# IMPORTANT: any `proxy_set_header` inside a `location` clears inheritance of
# server-level proxy_set_header values. Repeat Host / X-Real-IP /
# X-Forwarded-* in every location that uses proxy_pass, or enroll allowlisting
# will see 127.0.0.1 instead of the worker public IP.

limit_req_zone $binary_remote_addr zone=worker_poll:10m rate=300r/m;
limit_req_zone $binary_remote_addr zone=api_general:10m rate=600r/m;

upstream methyl_gateway {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name GATEWAY_HOSTNAME;

    ssl_certificate     /etc/ssl/methyl-gateway/fullchain.pem;
    ssl_certificate_key /etc/ssl/methyl-gateway/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers           HIGH:!aNULL:!MD5;

    location = /v1/workers/tasks/request {
        limit_req zone=worker_poll burst=60 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass http://methyl_gateway;
    }

    location /v1/ {
        limit_req zone=api_general burst=40 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass http://methyl_gateway;
    }

    location / {
        return 404;
    }
}
