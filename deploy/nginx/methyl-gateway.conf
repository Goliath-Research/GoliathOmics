# Compatibility name. Same site definition as goliath-gateway.conf.
# Health check: http://<host>/v1/health proxies to the gateway on 127.0.0.1:8080.

upstream goliath_gateway_methyl {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    location /v1/health {
        proxy_pass http://goliath_gateway_methyl;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
