name: GoliathOmics release deploy

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: Deploy bundle version (must match assemble GitHub Release)
        required: true
        type: string
      pullParabricks:
        description: Legacy docker pull of Clara during promote (unused when workers use goliath-worker host pbrun image)
        required: false
        type: boolean
        default: false
      runE2eVerify:
        description: Run verify_e2e_node.sh on the deploy runner
        required: false
        type: boolean
        default: false
      goliathRoot:
        description: Shared storage root on the runner
        required: false
        type: string
        default: /work/goliath
      target:
        description: Optional deploy target (deploy/targets/<name>.json). Empty uses the runner-local promote.
        required: false
        type: string
        default: ""
      forceSchema:
        description: Re-apply the release's GoliathApp SQL even if wf.schema_release already records this release
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: goliath-test
    steps:
      - uses: actions/checkout@v6
        continue-on-error: true

      - name: Ensure deploy tools
        run: |
          set -euo pipefail
          packages=()
          command -v jq >/dev/null 2>&1 || packages+=(jq)
          command -v ssh >/dev/null 2>&1 || packages+=(openssh-client)
          command -v psql >/dev/null 2>&1 || packages+=(postgresql-client)
          command -v curl >/dev/null 2>&1 || packages+=(curl)
          command -v python3 >/dev/null 2>&1 || packages+=(python3)
          if [[ ${#packages[@]} -gt 0 ]]; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y "${packages[@]}"
          fi
          if ! command -v gh >/dev/null 2>&1; then
            echo "gh is not available" >&2
            exit 1
          fi
          for cmd in jq ssh psql gh curl python3; do
            command -v "$cmd" >/dev/null 2>&1 || {
              echo "required tool not available: $cmd" >&2
              exit 1
            }
          done

      - name: Resolve Rollouts environment
        id: rollouts-env
        env:
          DEPLOY_TARGET: ${{ inputs.target }}
        run: |
          set +e
          fallback="production-work"
          env_name="$fallback"
          target="${DEPLOY_TARGET:-}"
          if [[ -n "$target" ]]; then
            if [[ ! "$target" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "target is not a profile id; Rollouts environment falls back to ${fallback}"
            elif [[ ! -f "deploy/targets/${target}.json" ]]; then
              echo "target profile deploy/targets/${target}.json is missing; Rollouts environment falls back to ${fallback}"
            elif ! command -v jq >/dev/null 2>&1; then
              echo "jq is not available; Rollouts environment falls back to ${fallback}"
            else
              from_profile="$(jq -r '.rollouts_environment // empty' "deploy/targets/${target}.json" 2>/dev/null || true)"
              if [[ -n "$from_profile" && "$from_profile" != "null" && "$from_profile" =~ ^[A-Za-z0-9._-]+$ ]]; then
                env_name="$from_profile"
              else
                echo "rollouts_environment is missing or not a safe id; Rollouts environment falls back to ${fallback}"
              fi
            fi
          fi
          echo "Rollouts environment: ${env_name}"
          echo "name=${env_name}" >> "${GITHUB_OUTPUT:-/dev/null}"
          exit 0

      - name: Report deployment start
        continue-on-error: true
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          RELEASE_VERSION: ${{ inputs.releaseVersion }}
          GH_TOKEN: ${{ github.token }}
          ROLLOUTS_ENVIRONMENT: ${{ steps.rollouts-env.outputs.name }}
        run: |
          set +e
          if [[ ! -f scripts/report_deploy.sh ]]; then
            echo "report_deploy.sh is not in this checkout; skipping Rollouts start"
            exit 0
          fi
          rollouts_env="${ROLLOUTS_ENVIRONMENT:-${GOLIATH_ENV:-production-work}}"
          export GOLIATH_ENV="$rollouts_env"
          PY=python3
          command -v python3 >/dev/null 2>&1 || PY=python
          ref_json=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/goliathomics-${RELEASE_VERSION}") || exit 0
          read -r sha typ < <("$PY" -c 'import json,sys; o=json.load(sys.stdin)["object"]; print(o["sha"], o["type"])' <<<"$ref_json") || exit 0
          if [[ "$typ" == "tag" ]]; then
            tag_json=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}") || exit 0
            sha=$("$PY" -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])' <<<"$tag_json") || exit 0
          fi
          if [[ ! "$sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "resolved deploy version is not a commit SHA" >&2
            exit 0
          fi
          bash scripts/report_deploy.sh start \
            --service goliathomics-runtime \
            --env "$GOLIATH_ENV" \
            --version "$sha" \
            --message "release ${RELEASE_VERSION}"
          exit 0

      - name: Download assembled bundle from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ inputs.releaseVersion }}"
          mkdir -p "${{ runner.temp }}/bundle-dl" "${{ runner.temp }}/bundle"
          gh release download "goliathomics-${VERSION}" \
            --repo "${{ github.repository }}" \
            --pattern "goliathomics-release-*.tar.gz" \
            --dir "${{ runner.temp }}/bundle-dl"
          tar -xzf "${{ runner.temp }}/bundle-dl"/goliathomics-release-*.tar.gz \
            -C "${{ runner.temp }}/bundle"

      - name: Install gateway SSH known hosts
        if: inputs.target != ''
        env:
          GOLIATH_GATEWAY_KNOWN_HOSTS: ${{ secrets.GOLIATH_GATEWAY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          # ssh-keyscan output, one or more lines, stored as an environment
          # secret. Do not scan the gateway from this job and do not disable
          # StrictHostKeyChecking.
          known="${GOLIATH_GATEWAY_KNOWN_HOSTS:-}"
          if [[ -z "${known//[[:space:]]/}" ]]; then
            echo "ERROR: GOLIATH_GATEWAY_KNOWN_HOSTS is empty. Set the goliath-test environment secret to the ssh-keyscan output for the gateway (one or more host lines) before this deploy." >&2
            exit 1
          fi
          umask 077
          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"
          printf '%s\n' "$known" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"

      - name: Deploy target profile
        if: inputs.target != ''
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GOLIATH_ROLLOUTS_SKIP_SERVICES: goliathomics-runtime
          GOLIATH_RELEASE_SRC: ${{ runner.temp }}/bundle
          GOLIATH_SCHEMA_FORCE: ${{ inputs.forceSchema && '1' || '0' }}
          NEON_TEST_PASSWORD: ${{ secrets.NEON_TEST_PASSWORD }}
          B2_ACCESS_KEY_ID: ${{ secrets.B2_ACCESS_KEY_ID }}
          B2_SECRET_ACCESS_KEY: ${{ secrets.B2_SECRET_ACCESS_KEY }}
          LONGTERM_ACCESS_KEY_ID: ${{ secrets.LONGTERM_ACCESS_KEY_ID }}
          LONGTERM_SECRET_ACCESS_KEY: ${{ secrets.LONGTERM_SECRET_ACCESS_KEY }}
          GOLIATH_DEPLOY_SSH_KEY: ${{ secrets.GOLIATH_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          [[ -f scripts/deploy_target.sh ]] || { echo "Missing scripts/deploy_target.sh"; exit 1; }
          [[ -f "${GOLIATH_RELEASE_SRC}/manifest.json" ]] || { echo "Release bundle was not staged"; exit 1; }
          bash scripts/deploy_target.sh --target "${{ inputs.target }}" --component all

      - name: Upload workflow_versions.json
        if: inputs.target != '' && always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-versions-${{ inputs.releaseVersion }}-${{ inputs.target }}
          path: ${{ runner.temp }}/goliath-env/workflow_versions.json
          if-no-files-found: warn


      - name: Rsync bundle and promote_release
        if: inputs.target == ''
        env:
          GOLIATH_ROLLOUTS_SKIP_SERVICES: goliathomics-runtime
        run: |
          set -euo pipefail
          ROOT="${{ inputs.goliathRoot }}"
          VERSION="${{ inputs.releaseVersion }}"
          RELEASE="$ROOT/releases/$VERSION"
          mkdir -p "$RELEASE"
          rsync -rl --delete --no-perms --no-owner --no-group \
            "${{ runner.temp }}/bundle/" "$RELEASE/"
          PROMOTE="$RELEASE/runtime-bundle/scripts/promote_release.sh"
          [[ -x "$PROMOTE" ]] || { echo "Missing promote script: $PROMOTE"; exit 1; }
          PB_FLAG=(--skip-docker-pull)
          if [[ "${{ inputs.pullParabricks }}" == "true" ]]; then
            PB_FLAG=(--pull-parabricks)
          fi
          bash "$PROMOTE" --root "$ROOT" --release "$RELEASE" --arch aarch64 "${PB_FLAG[@]}"
          bash "$PROMOTE" --root "$ROOT" --release "$RELEASE" --arch amd64 --skip-docker-pull
          echo "Promoted $VERSION -> $ROOT/current"

      - name: Post-promote verification
        if: inputs.target == ''
        run: |
          set -euo pipefail
          RUNTIME="${{ inputs.goliathRoot }}/current/runtime-bundle"
          if [[ ! -x "$RUNTIME/scripts/verify_setup.sh" ]]; then
            echo "Missing verify_setup.sh under $RUNTIME"
            exit 1
          fi
          GOLIATH_ROOT="${{ inputs.goliathRoot }}" bash "$RUNTIME/scripts/verify_setup.sh" --runtime-bundle
          if [[ -x "$RUNTIME/scripts/verify_e2e_node.sh" && "${{ inputs.runE2eVerify }}" == "true" ]]; then
            bash "$RUNTIME/scripts/verify_e2e_node.sh"
          fi
          echo "Deploy verification passed for ${{ inputs.releaseVersion }}"

      - name: Report deployment finish
        if: always()
        continue-on-error: true
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          ROLLOUTS_ENVIRONMENT: ${{ steps.rollouts-env.outputs.name }}
          DEPLOY_OUTCOME: ${{ job.status }}
        run: |
          set +e
          if [[ ! -f scripts/report_deploy.sh ]]; then
            echo "report_deploy.sh is not in this checkout; skipping Rollouts finish"
            exit 0
          fi
          rollouts_env="${ROLLOUTS_ENVIRONMENT:-${GOLIATH_ENV:-production-work}}"
          export GOLIATH_ENV="$rollouts_env"
          case "$DEPLOY_OUTCOME" in
            success)
              bash scripts/report_deploy.sh succeeded \
                --service goliathomics-runtime \
                --env "$GOLIATH_ENV" \
                --message "release deploy succeeded"
              ;;
            failure)
              bash scripts/report_deploy.sh failed \
                --service goliathomics-runtime \
                --env "$GOLIATH_ENV" \
                --message "release deploy failed"
              ;;
            cancelled)
              bash scripts/report_deploy.sh aborted \
                --service goliathomics-runtime \
                --env "$GOLIATH_ENV" \
                --message "release deploy aborted"
              ;;
            *)
              bash scripts/report_deploy.sh failed \
                --service goliathomics-runtime \
                --env "$GOLIATH_ENV" \
                --message "release deploy ${DEPLOY_OUTCOME}"
              ;;
          esac
          exit 0
