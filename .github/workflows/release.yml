name: GoliathOmics release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.12"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools
        run: python -m pip install -U pip build wheel pip-tools

      # build_release.sh proves the system-deps bundle installs with
      # --network none in ubuntu:24.04, in the oldest noble package set and
      # in the worker image of deploy/targets (runpod/pytorch:...-ubuntu2404,
      # ~10.6 GB compressed, ~3-5 min to pull). Make room for that image;
      # without room the worker-image check is skipped with a warning and
      # the stock/oldest checks still gate the release.
      - name: Free runner disk for the worker-image system-deps check
        run: |
          set -euo pipefail
          df -h / /mnt 2>/dev/null || df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune --all --force >/dev/null || true
          df -h /

      - name: Build release (wheels + runtime-bundle + manifest)
        id: build
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          bash scripts/build_release.sh \
            --version "$VERSION" \
            --output "${{ runner.temp }}/release" \
            --with-gpu-reqs
          tar -C "${{ runner.temp }}/release" -czf \
            "${{ runner.temp }}/methyl-pipeline-release-${VERSION}.tar.gz" .

      - name: Require methyl-gateway console script
        run: |
          set -euo pipefail
          bash scripts/check_gateway_wheel.sh "${{ runner.temp }}/release/wheels"

      - name: Require GoliathApp PostgreSQL scripts
        run: |
          set -euo pipefail
          # Deploy applies goliathapp-sql/ once per release
          # (scripts/apply_goliathapp_schema.sh). A release without it would
          # leave the database behind the gateway wheel.
          SQL="${{ runner.temp }}/release/goliathapp-sql"
          test -s "$SQL/manifest.sha256"
          test -s "$SQL/source.json"
          (cd "$SQL" && sha256sum --check --quiet --strict manifest.sha256)
          jq -e '.goliathapp_sql.commit | length > 0' "${{ runner.temp }}/release/manifest.json" >/dev/null
          echo "GoliathApp $(jq -r .commit "$SQL/source.json"): $(wc -l <"$SQL/manifest.sha256") sql_pg scripts"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: methyl-pipeline-release-${{ steps.build.outputs.version }}
          path: ${{ runner.temp }}/release

      - name: Publish GitHub Release tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.build.outputs.version }}"
          TARBALL="${{ runner.temp }}/methyl-pipeline-release-${VERSION}.tar.gz"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" "$TARBALL" --clobber
          else
            gh release create "v${VERSION}" \
              --title "MethylPipeline ${VERSION}" \
              --generate-notes \
              "$TARBALL"
          fi
