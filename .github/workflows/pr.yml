name: PR

on:
  pull_request:
    branches:
      - main

jobs:
  deploy-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Shellcheck deploy scripts
        run: |
          shellcheck -S warning -e SC1091 \
            scripts/report_deploy.sh \
            scripts/rollouts_hook.sh \
            scripts/deploy_target.sh \
            scripts/deploy_workflow_definitions.sh \
            scripts/deploy_mc_workflow_definitions.sh \
            scripts/deploy_process_pack_catalog.sh \
            scripts/promote_release.sh \
            scripts/install_release.sh \
            scripts/install_gateway_systemd.sh \
            scripts/install_gateway_venv.sh \
            scripts/setup_gateway_nginx.sh \
            scripts/provision_gateway_node.sh \
            scripts/test_setup_gateway_nginx.sh \
            scripts/install_worker_systemd.sh \
            scripts/install_reclaim_leases_timer.sh \
            scripts/bootstrap_goliath.sh \
            scripts/write_worker_env.sh \
            scripts/setup_gpu_node.sh \
            scripts/verify_setup.sh \
            scripts/verify_e2e_node.sh \
            scripts/init_work_layout.sh \
            scripts/start_shared_worker.sh \
            scripts/install_methyl_extractor_tarball.sh \
            scripts/provision_worker_node.sh \
            scripts/test_report_deploy.sh \
            scripts/test_deploy_target.sh \
            scripts/test_install_gateway_venv.sh \
            scripts/build_gateway_wheel.sh \
            scripts/check_gateway_wheel.sh \
            scripts/build_release.sh \
            scripts/test_gateway_wheel_release.sh \
            deploy/runpod/goliath-worker-bootstrap.sh \
            deploy/runpod/goliath-worker-start.sh \
            deploy/runpod/keepalive.sh \
            deploy/runpod/template-start-command.sh \
            workflow_engine/sql_pg/deploy_test_bed.sh

      - name: Rollouts reporter and target profile tests
        run: |
          bash scripts/test_report_deploy.sh
          bash scripts/test_deploy_target.sh
          bash scripts/test_gateway_wheel_release.sh

  pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Type check with Pyrefly
        run: |
          python -m pip install -U "pyrefly==1.3.2"
          pyrefly check

      - name: Install host CLIs
        run: sudo apt-get update && sudo apt-get install -y samtools

      - name: Install science packages and the methyl worker
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install -U pip pytest
          bash scripts/install_packages.sh --with-deps

      - name: Worker unit tests
        run: |
          . .venv/bin/activate
          python -m pytest workers/tests -q
